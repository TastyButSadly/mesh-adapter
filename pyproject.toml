[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-mesh-adapter"
version = "0.1.0"
description = "Differentiable fixed-topology mesh adaptation for externally generated meshes"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gmsh>=4.13",
    "matplotlib>=3.8",
    "meshio>=5.3",
    "numpy>=1.24",
    "pillow>=10",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
